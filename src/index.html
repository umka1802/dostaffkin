<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Dostaffkin — Доставка посылок между странами и внутри стран. Безопасно. Быстро. В целости и сохранности!
    </title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            const redirectUrl = sessionStorage.getItem('angular-redirect-url');
            if (redirectUrl) {
                // Удаляем ключ, чтобы не срабатывал каждый раз
                sessionStorage.removeItem('angular-redirect-url');

                // Если это не просто корень — перенаправляем через history, чтобы Angular подхватил маршрут
                if (redirectUrl !== '/' && redirectUrl !== '/dostaffkin/') {
                    // Убираем префикс /dostaffkin/, если он есть в сохранённом URL, чтобы не было дублей
                    let cleanPath = redirectUrl.replace(/^\/dostaffkin/, '');
                    if (!cleanPath || cleanPath === '/') {
                        cleanPath = '/';
                    }
                    window.history.replaceState(null, '', cleanPath);
                    // После replaceState страница не перезагружается, но Angular увидит новый URL и отрендерит нужный маршрут
                }
            }
        })();
    </script>

        data-suggest-apikey="6d5ec4c8-7d82-4d8b-b7c9-33767c01d76c"></script>
</head>

</body>

</html>
